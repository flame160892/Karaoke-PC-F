name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build aplikasi kasir (Karaoke-PC-F)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build aplikasi room (Karaoke-PC-F Room)
        run: npx electron-builder --config electron-builder-room.json --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cek file update tersedia
        shell: bash
        run: ls -la dist dist-room && test -f dist/latest.yml && test -f dist-room/room.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Karaoke-PC-F-Setup
          path: |
            dist/*.exe
            dist-room/*.exe
      - name: Baca versi
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Terbitkan Release (link download langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Karaoke-PC-F v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist-room/*.exe
            dist-room/*.exe.blockmap
            dist-room/room.yml
          body: |
            Dua aplikasi Windows:
            - **Karaoke-PC-F-Setup** → install di komputer KASIR (Desk + penyimpanan lagu)
            - **Karaoke-PC-F-Room-Setup** → install di PC/TV setiap ROOM (otomatis menemukan kasir, masukkan PIN, pilih room)

            Keduanya update otomatis.
